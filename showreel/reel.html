<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude — Motion Reel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  @font-face { font-family: "Instrument Serif"; font-style: italic; src: url(fonts/InstrumentSerif-Italic.woff2) format("woff2"); }
  @font-face { font-family: "Instrument Serif"; font-style: normal; src: url(fonts/InstrumentSerif-Regular.woff2) format("woff2"); }
  html, body { margin: 0; height: 100%; background: #000; }
  body { display: grid; place-items: center; overflow: hidden; }
  canvas { width: 100vw; max-width: calc(100vh * 16 / 9); aspect-ratio: 16 / 9; display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// ─────────────────────────────────────────────────────────────────────────────
//  CLAUDE — MOTION REEL '26
//  Every frame is a pure function of time: render(t). No state, no physics
//  accumulation, so any frame can be rendered in any order (parallel export).
// ─────────────────────────────────────────────────────────────────────────────
const W = 1920, H = 1080, FPS = 60, DUR = 15, TAU = Math.PI * 2;
const canvas = document.getElementById("c");
const out = canvas.getContext("2d");

// Scene buffer (everything draws here, then post-fx composites to `out`)
const F = document.createElement("canvas"); F.width = W; F.height = H;
const ctx = F.getContext("2d");
// Channel-split buffers
const CH = [0, 1, 2].map(() => { const c = document.createElement("canvas"); c.width = W; c.height = H; return c; });

// ── Palette ─────────────────────────────────────────────────────────────────
const INK = "#0B0B0F", BONE = "#F2EEE6", ORANGE = "#FF4B1F", BLUE = "#2A3BFF", NAVY = "#070818", LIME = "#D8FF3C";
const DISPLAY = '"Inter Display", "Inter", sans-serif';
const MONO = '"JetBrains Mono", monospace';
const SERIF = '"Instrument Serif", serif';

// ── Math / easing ───────────────────────────────────────────────────────────
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, t) => a + (b - a) * t;
const fract = x => x - Math.floor(x);
const E = {
  outExpo: t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
  inExpo: t => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
  inOutExpo: t => (t <= 0 ? 0 : t >= 1 ? 1 : t < 0.5 ? Math.pow(2, 20 * t - 10) / 2 : (2 - Math.pow(2, -20 * t + 10)) / 2),
  outCubic: t => 1 - Math.pow(1 - t, 3),
  inCubic: t => t * t * t,
  inOutCubic: t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
  outQuint: t => 1 - Math.pow(1 - t, 5),
  inOutQuint: t => (t < 0.5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2),
  outBack: t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  outElastic: t => (t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * (TAU / 3)) + 1),
};
function rng(seed) { // mulberry32
  return () => { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const hash = (i, j = 0) => { const r = rng(i * 7919 + j * 104729 + 13); r(); return r(); };
function hexToRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) { const A = hexToRgb(a), B = hexToRgb(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(",")})`; }

// ── Drawing helpers ─────────────────────────────────────────────────────────
function bg(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function circle(x, y, r, c) { if (r <= 0) return; ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); }
function ring(x, y, r, lw, c) { if (r <= 0 || lw <= 0) return; ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.stroke(); }
function font(weight, size, family, style = "") { ctx.font = `${style} ${weight} ${size}px ${family}`; }
// Lay out letters with custom tracking; returns [{ch, x, w}] centred on cx
function layout(text, tracking, cx) {
  const ws = [...text].map(ch => ctx.measureText(ch).width);
  const total = ws.reduce((a, b) => a + b, 0) + tracking * (text.length - 1);
  let x = cx - total / 2;
  return [...text].map((ch, i) => { const o = { ch, x, w: ws[i] }; x += ws[i] + tracking; return o; });
}

// ─────────────────────────────────────────────────────────────────────────────
//  Precomputed data (deterministic)
// ─────────────────────────────────────────────────────────────────────────────
const KN = 200, KM = 12;           // knot / sphere mesh resolution
const NP = 5600;                    // particle count
let P = null;                        // particle table

function sampleText(text, fontStr, step) {
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  g.fillStyle = "#fff"; g.font = fontStr; g.textAlign = "center"; g.textBaseline = "middle";
  g.letterSpacing = "-12px";
  g.fillText(text, W / 2, H / 2 + 10);
  const d = g.getImageData(0, 0, W, H).data, pts = [];
  for (let y = 0; y < H; y += step) for (let x = 0; x < W; x += step) if (d[(y * W + x) * 4 + 3] > 128) pts.push([x, y]);
  return pts;
}

function init() {
  const r = rng(42);
  const craft = sampleText("CRAFT", `900 430px ${DISPLAY}`, 6);
  // shuffle
  for (let i = craft.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [craft[i], craft[j]] = [craft[j], craft[i]]; }
  P = [];
  for (let i = 0; i < NP; i++) {
    const v = i % (KN * KM);
    const tgt = craft[i % craft.length];
    P.push({
      v, tx: tgt[0] + (r() - 0.5) * 2, ty: tgt[1] + (r() - 0.5) * 2,
      delay: r() * 0.28, swirl: (r() - 0.5) * 900, jx: (r() - 0.5) * 30, jy: (r() - 0.5) * 30,
      // grid target for the hand-off into scene 5 (tile centres)
      gx: (Math.floor(r() * 16) + 0.5) * 120, gy: (Math.floor(r() * 9) + 0.5) * 120,
      hot: r() < 0.13, size: r() < 0.1 ? 4 : 2.6, ph: r() * TAU,
    });
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  3D: torus knot ↔ sphere
// ─────────────────────────────────────────────────────────────────────────────
function knotPoint(u, v) {
  const p = 2, q = 3, phi = u * TAU, th = v * TAU;
  const C = (f) => { const rr = 2 + Math.cos(q * f); return [rr * Math.cos(p * f), rr * Math.sin(p * f), Math.sin(q * f)]; };
  const c = C(phi), c2 = C(phi + 0.001);
  const T = [c2[0] - c[0], c2[1] - c[1], c2[2] - c[2]];
  const core = [2 * Math.cos(p * phi), 2 * Math.sin(p * phi), 0];
  let n = [c[0] - core[0], c[1] - core[1], c[2] - core[2]];
  let nl = Math.hypot(...n); n = n.map(x => x / nl);
  let b = [T[1] * n[2] - T[2] * n[1], T[2] * n[0] - T[0] * n[2], T[0] * n[1] - T[1] * n[0]];
  const bl = Math.hypot(...b); b = b.map(x => x / bl);
  const rt = 0.42, s = 0.62;
  return [0, 1, 2].map(k => (c[k] + rt * (Math.cos(th) * n[k] + Math.sin(th) * b[k])) * s);
}
function spherePoint(u, v) {
  const lon = u * TAU * 3, lat = (v + 0.5 / KM - 0.5) * Math.PI * 0.92; // 3 wraps → spiral-ish globe
  const R = 2.0;
  const y = Math.sin(lat + (u - 0.5) * (Math.PI / KM)) * R;
  const rr = Math.cos(lat + (u - 0.5) * (Math.PI / KM)) * R;
  return [Math.cos(lon) * rr, y, Math.sin(lon) * rr];
}
function rotate([x, y, z], ax, ay) {
  let c = Math.cos(ay), s = Math.sin(ay); [x, z] = [x * c + z * s, -x * s + z * c];
  c = Math.cos(ax); s = Math.sin(ax); [y, z] = [y * c - z * s, y * s + z * c];
  return [x, y, z];
}
function project([x, y, z], scale = 1, cx = W / 2, cy = H / 2) {
  const d = 7, f = 820 * scale, k = f / (d + z);
  return [cx + x * k, cy + y * k, z];
}
function meshAt(t) {
  const m = E.inOutCubic(seg(t, 4.85, 5.45));
  const ay = t * 1.1 + E.inExpo(seg(t, 5.4, 6.0)) * 2.6, ax = 0.5 + Math.sin(t * 0.9) * 0.25;
  // anticipation: squash in before the burst
  const sc = (1 + 0.06 * E.outBack(seg(t, 4.0, 4.5)) - 0.06) * (1 - 0.14 * E.inOutCubic(seg(t, 5.45, 5.95)));
  const pts = new Array(KN * KM);
  for (let i = 0; i < KN; i++) for (let j = 0; j < KM; j++) {
    const u = i / KN, v = j / KM;
    const a = knotPoint(u, v), b = spherePoint(u, v);
    const p = [lerp(a[0], b[0], m), lerp(a[1], b[1], m), lerp(a[2], b[2], m)];
    pts[i * KM + j] = project(rotate(p, ax, ay), sc);
  }
  return { pts, m };
}

// ─────────────────────────────────────────────────────────────────────────────
//  SCENE 1 — IDENT (0 → 2)
// ─────────────────────────────────────────────────────────────────────────────
function s1(t) {
  bg(INK);
  const cx = W / 2, cy = H / 2;
  // faint blueprint grid fading in
  const gA = 0.07 * seg(t, 0.2, 0.8) * (1 - seg(t, 1.5, 1.9));
  if (gA > 0) {
    ctx.strokeStyle = `rgba(242,238,230,${gA})`; ctx.lineWidth = 1; ctx.beginPath();
    for (let x = 0; x <= W; x += 80) { ctx.moveTo(x + 0.5, 0); ctx.lineTo(x + 0.5, H); }
    for (let y = 0; y <= H; y += 80) { ctx.moveTo(0, y + 0.5); ctx.lineTo(W, y + 0.5); }
    ctx.stroke();
  }
  // seed dot: overshoot in, collapse into the burst
  const d = E.outBack(seg(t, 0.05, 0.35)) * (1 - E.inExpo(seg(t, 0.36, 0.46)));
  circle(cx, cy, 16 * d, ORANGE);
  // shockwave rings
  [[0.44, ORANGE, 46, 760], [0.5, BLUE, 18, 980], [0.56, BONE, 4, 1200]].forEach(([s, c, lw, R]) => {
    const p = seg(t, s, s + 0.75);
    if (p > 0 && p < 1) ring(cx, cy, lerp(8, R, E.outExpo(p)), lw * (1 - E.outCubic(p)), c);
  });
  // trim-path radial lines (head leads, tail follows)
  ctx.lineCap = "round";
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * TAU + 0.13, o = (i % 3) * 0.02;
    const head = lerp(40, 560 + (i % 2) * 140, E.outExpo(seg(t, 0.44 + o, 0.95 + o)));
    const tail = lerp(40, 560 + (i % 2) * 140, E.outExpo(seg(t, 0.56 + o, 1.12 + o)));
    if (head - tail < 0.5) continue;
    ctx.strokeStyle = i % 4 === 0 ? ORANGE : BONE; ctx.lineWidth = i % 2 ? 3 : 6;
    ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * tail, cy + Math.sin(a) * tail);
    ctx.lineTo(cx + Math.cos(a) * head, cy + Math.sin(a) * head); ctx.stroke();
  }
  // CLAUDE — masked letter rise with tracking collapse, then slice exit
  font(900, 300, DISPLAY);
  const track = lerp(60, -10, E.outExpo(seg(t, 0.55, 1.3)));
  const L = layout("CLAUDE", track, cx);
  const base = cy + 105, top = base - 235, hgt = 270;
  const ex = E.inExpo(seg(t, 1.5, 1.82));
  for (const half of [0, 1]) {
    ctx.save();
    ctx.beginPath(); ctx.rect(0, half ? top + hgt / 2 : top - 20, W, half ? hgt / 2 + 20 : hgt / 2 + 20); ctx.clip();
    ctx.translate((half ? 1 : -1) * ex * W * 1.1, 0);
    ctx.beginPath(); ctx.rect(0, top - 20, W, hgt + 40); ctx.clip();
    L.forEach((l, i) => {
      const p = E.outExpo(seg(t, 0.55 + i * 0.045, 1.15 + i * 0.045));
      ctx.fillStyle = BONE;
      ctx.fillText(l.ch, l.x, base + (1 - p) * 300);
    });
    // orange registration bar sweeping through the word
    const bp = seg(t, 1.0, 1.45);
    if (bp > 0 && bp < 1) {
      const x0 = lerp(L[0].x - 40, L[5].x + L[5].w + 40, E.inOutCubic(bp));
      ctx.fillStyle = ORANGE; ctx.fillRect(x0 - 8, top - 20, 16, hgt + 40);
    }
    ctx.restore();
  }
  // subtitle typed in mono with block cursor
  font(500, 26, MONO);
  const sub = "MOTION DESIGNER  /  SHOWREEL 2026";
  const n = Math.floor(seg(t, 0.9, 1.35) * sub.length);
  ctx.globalAlpha = 1 - seg(t, 1.5, 1.65);
  const sw = ctx.measureText(sub).width, sx = cx - sw / 2;
  ctx.fillStyle = BONE; ctx.fillText(sub.slice(0, n), sx, base + 90);
  if (t > 0.85 && Math.floor(t * 8) % 2 === 0) { ctx.fillStyle = ORANGE; ctx.fillRect(sx + ctx.measureText(sub.slice(0, n)).width + 4, base + 66, 14, 30); }
  ctx.globalAlpha = 1;
}

// ─────────────────────────────────────────────────────────────────────────────
//  SCENE 2 — KINETIC TYPE (2 → 4)   "EVERY FRAME IS A DECISION"
// ─────────────────────────────────────────────────────────────────────────────
function s2(t) {
  const u = t - 2;
  const cx = W / 2, cy = H / 2;
  ctx.textBaseline = "alphabetic";
  if (u < 0.25) { // EVERY — punch-in with staggered letters
    bg(ORANGE);
    const k = seg(u, 0, 0.22);
    font(900, 330, DISPLAY);
    const L = layout("EVERY", -14, cx);
    ctx.save(); ctx.translate(cx, cy); ctx.scale(lerp(1.35, 1, E.outExpo(k)), lerp(1.35, 1, E.outExpo(k))); ctx.translate(-cx, -cy);
    L.forEach((l, i) => { const p = E.outExpo(seg(u, i * 0.018, 0.16 + i * 0.018)); ctx.fillStyle = INK; ctx.fillText(l.ch, l.x, cy + 118 + (1 - p) * 160 * (i % 2 ? -1 : 1)); });
    ctx.restore();
  } else if (u < 0.5) { // FRAME — crop marks trim in around the word
    bg(INK);
    const v = u - 0.25;
    font(900, 290, DISPLAY); ctx.fillStyle = BONE;
    const L = layout("FRAME", -10, cx);
    L.forEach((l, i) => { const p = E.outExpo(seg(v, i * 0.015, 0.14 + i * 0.015)); ctx.globalAlpha = p; ctx.fillText(l.ch, l.x - (1 - p) * 120, cy + 104); });
    ctx.globalAlpha = 1;
    const x0 = L[0].x - 70, x1 = L[4].x + L[4].w + 70, y0 = cy - 200, y1 = cy + 190;
    const pk = E.outExpo(seg(v, 0.0, 0.18)), len = 110 * pk, ins = (1 - pk) * 120;
    ctx.strokeStyle = ORANGE; ctx.lineWidth = 10; ctx.lineCap = "butt"; ctx.beginPath();
    [[x0 - ins, y0 - ins, 1, 1], [x1 + ins, y0 - ins, -1, 1], [x0 - ins, y1 + ins, 1, -1], [x1 + ins, y1 + ins, -1, -1]].forEach(([x, y, sx, sy]) => {
      ctx.moveTo(x + sx * len, y); ctx.lineTo(x, y); ctx.lineTo(x, y + sy * len);
    });
    ctx.stroke();
  } else if (u < 0.75) { // IS — outlined, swings in with overshoot
    bg(BLUE);
    const v = u - 0.5, p = E.outBack(seg(v, 0, 0.2));
    font(900, 560, DISPLAY);
    ctx.save(); ctx.translate(cx, cy + 200); ctx.rotate((1 - p) * -0.9); ctx.textAlign = "center";
    ctx.lineWidth = 8; ctx.strokeStyle = BONE;
    for (let e = 3; e >= 1; e--) { ctx.globalAlpha = 0.25 * (4 - e) / 3 * p; ctx.strokeText("IS", e * 34 * (1 - seg(v, 0.05, 0.25)), -e * 6); }
    ctx.globalAlpha = 1; ctx.fillStyle = BONE; ctx.fillText("IS", 0, 0);
    ctx.restore(); ctx.textAlign = "left";
  } else if (u < 1.0) { // A — giant glyph slammed up past the frame
    bg(BONE);
    const v = u - 0.75;
    font(900, 1300, DISPLAY); ctx.textAlign = "center"; ctx.fillStyle = INK;
    ctx.fillText("A", cx + 40, cy + 560 + (1 - E.outExpo(seg(v, 0, 0.16))) * 900);
    ctx.fillStyle = ORANGE; ctx.fillRect(0, H - 40 - 30 * (1 - E.outExpo(seg(v, 0, 0.2))), W * E.outExpo(seg(v, 0.02, 0.2)), 40);
    ctx.textAlign = "left";
  } else { // DECISION — scrolling outline stack, filled hero
    const v = u - 1.0;
    const inv = v >= 0.5; // flip palette on the next beat
    bg(inv ? ORANGE : INK);
    font(900, 200, DISPLAY);
    const L = layout("DECISION", -8, cx);
    const lh = 176, scroll = (v * 260) % lh;
    ctx.lineWidth = 3;
    for (let r = -4; r <= 4; r++) {
      if (r === 0) continue;
      const y = cy + 72 + r * lh - scroll;
      ctx.strokeStyle = inv ? INK : (Math.abs(r) === 1 ? ORANGE : "rgba(242,238,230,0.45)");
      const p = E.outExpo(seg(v, 0.04 + Math.abs(r) * 0.035, 0.4 + Math.abs(r) * 0.035));
      ctx.globalAlpha = p;
      L.forEach(l => ctx.strokeText(l.ch, l.x + (r % 2 ? 1 : -1) * (1 - p) * 300, y));
    }
    ctx.globalAlpha = 1;
    ctx.save(); ctx.beginPath(); ctx.rect(0, cy - 110, W, 220); ctx.clip();
    if (!inv) { ctx.fillStyle = INK; ctx.fillRect(0, cy - 110, W, 220); }
    L.forEach((l, i) => {
      const p = E.outBack(seg(v, i * 0.03, 0.28 + i * 0.03));
      ctx.fillStyle = inv ? BONE : ORANGE;
      ctx.fillText(l.ch, l.x, cy + 72 + (1 - p) * -220);
    });
    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
//  SCENE 3 — GEOMETRY (4 → 6)  torus knot → sphere, with annotation callouts
// ─────────────────────────────────────────────────────────────────────────────
function s3(t) {
  const g = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, 1100);
  g.addColorStop(0, "#151a52"); g.addColorStop(1, NAVY);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const { pts, m } = meshAt(t);
  // depth-bucketed strokes: near = orange, far = blue
  const B = 7, buckets = Array.from({ length: B }, () => []);
  const zb = z => clamp(Math.floor((z + 2.4) / 4.8 * B), 0, B - 1);
  for (let i = 0; i < KN; i++) for (let j = 0; j < KM; j++) {
    const a = pts[i * KM + j], b = pts[((i + 1) % KN) * KM + j], c = pts[i * KM + (j + 1) % KM];
    buckets[zb((a[2] + b[2]) / 2)].push(a, b);
    if (i % 2 === 0) buckets[zb((a[2] + c[2]) / 2)].push(a, c);
  }
  ctx.lineCap = "round";
  for (let k = B - 1; k >= 0; k--) {
    const near = 1 - k / (B - 1);
    ctx.strokeStyle = mix(BLUE, ORANGE, near * near);
    ctx.globalAlpha = lerp(0.25, 1, near);
    ctx.lineWidth = lerp(1, 3.2, near);
    ctx.beginPath(); const arr = buckets[k];
    for (let q = 0; q < arr.length; q += 2) { ctx.moveTo(arr[q][0], arr[q][1]); ctx.lineTo(arr[q + 1][0], arr[q + 1][1]); }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  // vertex dots appear as it becomes a globe
  if (m > 0.4) {
    ctx.fillStyle = BONE;
    for (let i = 0; i < KN; i += 4) for (let j = 0; j < KM; j++) {
      const p = pts[i * KM + j]; if (p[2] > 0.3) continue;
      const s = 2.4 * (m - 0.4) / 0.6; ctx.fillRect(p[0] - s, p[1] - s, s * 2, s * 2);
    }
  }
  // orbit ring + satellite
  const oa = seg(t, 4.1, 4.5);
  if (oa > 0) {
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.rotate(-0.35);
    ctx.strokeStyle = "rgba(242,238,230,0.35)"; ctx.lineWidth = 1.5; ctx.setLineDash([2, 10]);
    ctx.beginPath(); ctx.ellipse(0, 0, 640, 170, 0, 0, TAU * E.outExpo(oa)); ctx.stroke(); ctx.setLineDash([]);
    const sa = t * 2.4; circle(Math.cos(sa) * 640, Math.sin(sa) * 170, 9, LIME);
    ctx.restore();
  }
  // callout annotation
  const label = m < 0.5 ? ["TORUS KNOT", "p 2  ·  q 3  ·  2,400 SEG"] : ["SPHERE", "r 2.0  ·  LAT 12  ·  MORPH 100%"];
  const ca = E.outExpo(seg(t, 4.25, 4.7)) * (1 - E.inExpo(seg(t, 5.6, 5.85)));
  if (ca > 0) {
    const anchor = pts[Math.floor(KN * 0.1) * KM];
    const ex = 1380, ey = 250;
    ctx.strokeStyle = BONE; ctx.lineWidth = 2; ctx.globalAlpha = ca;
    ctx.beginPath(); ctx.moveTo(anchor[0], anchor[1]);
    const mx = lerp(anchor[0], ex - 60, ca), my = lerp(anchor[1], ey, ca);
    ctx.lineTo(mx, my); ctx.lineTo(mx + 300 * ca, my); ctx.stroke();
    ring(anchor[0], anchor[1], 10, 2, BONE);
    font(800, 34, DISPLAY); ctx.fillStyle = BONE; ctx.fillText(label[0], mx + 4, my - 14);
    font(400, 18, MONO); ctx.fillStyle = ORANGE; ctx.fillText(label[1], mx + 4, my + 32);
    ctx.globalAlpha = 1;
  }
  // morph progress meter
  const mm = seg(t, 4.3, 4.6);
  if (mm > 0) {
    ctx.globalAlpha = mm * (1 - seg(t, 5.6, 5.85));
    font(400, 16, MONO); ctx.fillStyle = BONE; ctx.fillText("MORPH", 150, 880);
    ctx.fillStyle = "rgba(242,238,230,0.2)"; ctx.fillRect(150, 895, 320, 4);

// ─────────────────────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────────────────────

// ─────────────────────────────────────────────────────────────────────────────
//  SCENE 7 — MONTAGE (12 → 13.5)  six 1/8-note cuts, six styles
// ─────────────────────────────────────────────────────────────────────────────
const CUTS = ["HALFTONE", "SQUASH & STRETCH", "ISOMETRIC", "SIGNAL", "ORBITALS", "GLITCH"];
function s7(t) {

// impacts drive camera shake, chroma split and flashes
const HITS = [[0.44, 0.6], [2.0, 0.5], [3.0, 0.7], [4.0, 0.6], [6.0, 1.0], [8.0, 0.5], [10.0, 1.4], [10.5, 0.5], [11.0, 0.7], [11.5, 0.5],
  [12.0, 0.8], [12.25, 0.4], [12.5, 0.4], [12.75, 0.4], [13.0, 0.4], [13.25, 0.8], [13.5, 1.0]];
function impact(t) { let s = 0; for (const [h, a] of HITS) if (t >= h) s += a * Math.exp(-(t - h) * 9); return s; }

function sectionName(t) {
  if (t < 2) return "01 — IDENT"; if (t < 4) return "02 — KINETIC TYPE"; if (t < 6) return "03 — GEOMETRY";
  if (t < 8) return "04 — PARTICLES"; if (t < 10) return "05 — SYSTEMS"; if (t < 12) return "06 — PRINCIPLES";
  if (t < 13.5) return `07.${Math.min(6, Math.floor((t - 12) / 0.25) + 1)} — ${CUTS[Math.min(5, Math.floor((t - 12) / 0.25))]}`;
  return "08 — END CARD";
}
function hud(t, frame) {
  const a = seg(t, 0.6, 1.0) * (1 - seg(t, 13.45, 13.6));
  if (a <= 0) return;
  out.save(); out.globalCompositeOperation = "difference"; out.globalAlpha = a; out.fillStyle = "#fff"; out.strokeStyle = "#fff";
  out.font = `500 17px ${MONO}`; out.textBaseline = "middle";
  const m = 56;
  out.fillText("CLAUDE® — MOTION REEL ’26", m + 30, m);
  const ff = frame % FPS, ss = Math.floor(frame / FPS);
  const tc = `00:00:${String(ss).padStart(2, "0")}:${String(ff).padStart(2, "0")}`;
  out.textAlign = "right"; out.fillText(`● REC  ${tc}`, W - m - 30, m);
  out.textAlign = "left"; out.fillText(sectionName(t), m + 30, H - m);
  // progress
  out.fillRect(W - m - 30 - 240, H - m, 240 * (t / DUR), 2); out.globalAlpha = a * 0.35; out.fillRect(W - m - 30 - 240, H - m, 240, 2); out.globalAlpha = a;
  // crop marks
  out.lineWidth = 2; out.beginPath();
  [[m, m, 1, 1], [W - m, m, -1, 1], [m, H - m, 1, -1], [W - m, H - m, -1, -1]].forEach(([x, y, sx, sy]) => {
    out.moveTo(x, y + sy * 18); out.lineTo(x, y); out.lineTo(x + sx * 18, y);
  });
  out.stroke();
  out.restore();
}

function render(frame) {
  const t = frame / FPS;
  drawScene(t);
  const imp = impact(t);
  // camera shake (deterministic)
  const sx = (hash(frame, 1) - 0.5) * 28 * imp, sy = (hash(frame, 2) - 0.5) * 28 * imp;
  const split = Math.min(14, imp * 9);
  out.fillStyle = "#000"; out.fillRect(0, 0, W, H);
  if (split > 1) {
    const cols = ["#f00", "#0f0", "#00f"];
    CH.forEach((c, i) => {
      const g = c.getContext("2d"); g.globalCompositeOperation = "source-over"; g.drawImage(F, 0, 0);
      g.globalCompositeOperation = "multiply"; g.fillStyle = cols[i]; g.fillRect(0, 0, W, H);
    });
    out.globalCompositeOperation = "lighter";
    out.drawImage(CH[0], sx + split, sy); out.drawImage(CH[1], sx, sy); out.drawImage(CH[2], sx - split, sy);
    out.globalCompositeOperation = "source-over";
  } else out.drawImage(F, sx, sy);
  // flash on the heaviest hits
  const fl = [[6.0, 0.35], [10.0, 0.7], [13.5, 0.45]].reduce((s, [h, a]) => s + (t >= h ? a * Math.exp(-(t - h) * 18) : 0), 0);
  if (fl > 0.01) { out.fillStyle = `rgba(255,250,240,${fl})`; out.fillRect(0, 0, W, H); }
  // vignette
  const v = out.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.45)");
  out.fillStyle = v; out.fillRect(0, 0, W, H);
  hud(t, frame);
}

// ─────────────────────────────────────────────────────────────────────────────
//  Boot: export mode (?render) exposes frame(); otherwise realtime playback
// ─────────────────────────────────────────────────────────────────────────────
window.ready = (async () => {
  await Promise.all([
    document.fonts.load(`900 100px "Inter Display"`), document.fonts.load(`400 100px "JetBrains Mono"`),
    document.fonts.load(`500 100px "JetBrains Mono"`), document.fonts.load(`italic 400 100px "Instrument Serif"`),
  ]);
  init();
  return true;
})();
window.frame = (n) => { render(n); return canvas.toDataURL("image/png"); };

if (!location.search.includes("render")) {
  window.ready.then(() => {
    const audio = new Audio("showreel.wav");
    let t0 = performance.now(), started = false;
    const loop = () => {
      const now = started && !audio.paused ? audio.currentTime : ((performance.now() - t0) / 1000) % DUR;
      render(Math.min(DUR * FPS - 1, Math.floor(now * FPS)));
      requestAnimationFrame(loop);
    };
    canvas.addEventListener("click", () => { audio.currentTime = 0; audio.play().then(() => { started = true; }).catch(() => {}); });
    audio.addEventListener("ended", () => { started = false; t0 = performance.now(); });
    loop();
  });
}
</script>
</body>
